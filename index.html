<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#79a9d6">
<title>Jesús de la Misericordia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#79a9d6}
.sky{
 position:fixed;inset:-8%;
 background:url("nubes_reales.png") center center/cover no-repeat;
 animation:cloudDrift 30s ease-in-out infinite alternate;
 will-change:transform;
}
.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,58,95,.08),rgba(255,193,92,.08) 58%,rgba(12,38,70,.12))}
.content{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
h1{margin:0 0 28px;font-size:clamp(2rem,7vw,4rem);font-weight:500;letter-spacing:.02em;text-shadow:0 3px 18px rgba(0,0,0,.28)}
button{appearance:none;border:0;border-radius:999px;padding:16px 28px;min-height:54px;font-size:1.05rem;font-weight:600;color:#284766;background:rgba(255,255,255,.92);box-shadow:0 8px 28px rgba(0,0,0,.22);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
#status{margin-top:16px;font-size:.88rem;text-shadow:0 2px 8px rgba(0,0,0,.35);min-height:1.2em}
@keyframes cloudDrift{
 0%{transform:translate3d(-2.5%,0,0) scale(1.04)}
 50%{transform:translate3d(1.5%,-.6%,0) scale(1.075)}
 100%{transform:translate3d(4%,.3%,0) scale(1.11)}
}
@media (prefers-reduced-motion:reduce){.sky{animation:none}}
</style>
</head>
<body>
<div class="sky"></div>
<main class="content">
<h1>Jesús de la Misericordia</h1>
<button id="play">▶ Escucha la Oración</button>
<div id="status"></div>
<audio id="audio" preload="auto" playsinline><source src="oracion.mp3" type="audio/mpeg"></audio>
</main>
<script>
const audio=document.getElementById("audio"),button=document.getElementById("play"),status=document.getElementById("status");
async function intentarReproducir(){try{await audio.play();button.textContent="❚❚ Pausar";status.textContent=""}catch(e){}}
window.addEventListener("load",intentarReproducir);
button.addEventListener("click",async()=>{if(audio.paused){try{await audio.play();button.textContent="❚❚ Pausar";status.textContent=""}catch(e){status.textContent="Toca nuevamente para reproducir la oración."}}else{audio.pause();button.textContent="▶ Escucha la Oración"}});
audio.addEventListener("ended",()=>button.textContent="▶ Escucha la Oración");
</script>
</body>
</html>
